<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>长沙 · 武功山 · 南昌旅行景点地图</title>
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./leaflet.css">
  <style>:root {
  --ink: #172035;
  --muted: #667085;
  --paper: #f6f4ef;
  --card: rgba(255, 255, 255, 0.94);
  --line: #ddd8cd;
  --orange: #f3703a;
  --orange-dark: #b83f1e;
  --teal: #176b67;
  --blue: #245b9c;
  --purple: #7657a7;
  --warning: #b42318;
  --shadow: 0 18px 45px rgba(31, 39, 61, 0.14);
}

/* Leaflet's structural CSS is inlined so the map remains correctly laid out
   even when the external stylesheet is slow or blocked. */
.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
  position: absolute;
  top: 0;
  left: 0;
}
.leaflet-container { overflow: hidden; background: #ddd; outline-offset: 1px; -webkit-tap-highlight-color: transparent; }
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
  display: block;
  -webkit-user-select: none;
  user-select: none;
  -webkit-user-drag: none;
}
.leaflet-tile { visibility: hidden; }
.leaflet-tile-loaded { visibility: inherit; }
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container .leaflet-tile {
  width: auto;
  max-width: none !important;
  max-height: none !important;
  padding: 0;
}
.leaflet-pane { z-index: 400; }
.leaflet-tile-pane { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane { z-index: 500; }
.leaflet-marker-pane { z-index: 600; }
.leaflet-tooltip-pane { z-index: 650; }
.leaflet-popup-pane { z-index: 700; }
.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg { z-index: 200; }
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container { pointer-events: none; }
.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive { pointer-events: auto; }
.leaflet-zoom-animated { transform-origin: 0 0; }
.leaflet-top,
.leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
.leaflet-top { top: 0; }
.leaflet-bottom { bottom: 0; }
.leaflet-left { left: 0; }
.leaflet-right { right: 0; }
.leaflet-control { position: relative; z-index: 800; float: left; clear: both; pointer-events: auto; }
.leaflet-right .leaflet-control { float: right; }
.leaflet-top .leaflet-control { margin-top: 10px; }
.leaflet-bottom .leaflet-control { margin-bottom: 10px; }
.leaflet-left .leaflet-control { margin-left: 10px; }
.leaflet-right .leaflet-control { margin-right: 10px; }
.leaflet-bar { border-radius: 4px; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.45); }
.leaflet-bar a {
  display: block;
  width: 28px;
  height: 28px;
  border-bottom: 1px solid #ccc;
  background: white;
  color: #172035;
  font: bold 18px/28px Arial, sans-serif;
  text-align: center;
  text-decoration: none;
}
.leaflet-bar a:first-child { border-radius: 4px 4px 0 0; }
.leaflet-bar a:last-child { border-bottom: 0; border-radius: 0 0 4px 4px; }
.leaflet-control-attribution { padding: 0 5px; background: rgba(255, 255, 255, 0.82); font-size: 10px; }
.leaflet-popup,
.leaflet-tooltip { position: absolute; }
.leaflet-popup-content-wrapper {
  padding: 1px;
  border-radius: 12px;
  background: white;
  box-shadow: 0 3px 14px rgba(0, 0, 0, 0.28);
}
.leaflet-popup-content { margin: 13px 20px; }
.leaflet-popup-close-button { position: absolute; top: 4px; right: 6px; color: #667085; text-decoration: none; }
.leaflet-tooltip { white-space: nowrap; pointer-events: none; }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
}

body {
  background:
    radial-gradient(circle at 8% 8%, rgba(243, 112, 58, 0.13), transparent 26rem),
    radial-gradient(circle at 90% 2%, rgba(23, 107, 103, 0.11), transparent 30rem),
    var(--paper);
}

button, select { font: inherit; }

button { cursor: pointer; }

.app-shell {
  width: min(1680px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  padding: 22px 28px 14px;
}

.hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  padding: 8px 4px 20px;
}

.eyebrow, .kicker {
  margin: 0 0 7px;
  color: var(--orange-dark);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-family: "STSong", "Songti SC", serif;
  font-size: clamp(30px, 4vw, 54px);
  font-weight: 900;
  letter-spacing: -0.04em;
}

.hero-copy {
  max-width: 720px;
  margin: 9px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.itinerary-strip {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 15px;
  border: 1px solid rgba(23, 32, 53, 0.08);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.75);
  box-shadow: 0 8px 22px rgba(31, 39, 61, 0.08);
  white-space: nowrap;
  font-size: 13px;
}

.itinerary-strip b { color: var(--orange-dark); }
.itinerary-strip i { color: #a9a39a; font-style: normal; }

.city-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}

.city-tabs::-webkit-scrollbar { display: none; }

.city-tab {
  min-width: 88px;
  padding: 10px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.7);
  color: var(--ink);
  font-weight: 800;
  transition: 160ms ease;
  white-space: nowrap;
}

.city-tab span {
  margin-left: 4px;
  color: var(--muted);
  font-size: 11px;
}

.city-tab:hover, .city-tab:focus-visible { transform: translateY(-1px); }
.city-tab.active { border-color: var(--ink); background: var(--ink); color: white; }
.city-tab.active span { color: #dce1ec; }

.workspace {
  display: grid;
  grid-template-columns: minmax(330px, 390px) minmax(0, 1fr);
  gap: 12px;
  height: min(760px, calc(100vh - 205px));
  min-height: 610px;
}

.panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  min-width: 0;
  overflow: auto;
  padding-right: 2px;
  scrollbar-color: #c7c0b5 transparent;
  scrollbar-width: thin;
}

.info-card {
  min-width: 0;
  border: 1px solid rgba(23, 32, 53, 0.08);
  border-radius: 18px;
  background: var(--card);
  box-shadow: 0 10px 30px rgba(31, 39, 61, 0.07);
  padding: 16px;
}

.overview-card {
  position: relative;
  overflow: hidden;
  color: white;
  background: linear-gradient(125deg, #172035, #263856 62%, #176b67);
}

.overview-card::after {
  position: absolute;
  right: -35px;
  bottom: -55px;
  width: 150px;
  height: 150px;
  border: 24px solid rgba(255, 255, 255, 0.06);
  border-radius: 50%;
  content: "";
}

.overview-card h2, .section-heading h2 {
  margin: 0;
  font-size: 17px;
  line-height: 1.35;
}

.overview-card p {
  position: relative;
  z-index: 1;
  margin: 8px 0 0;
  color: #d8e1ec;
  font-size: 12px;
  line-height: 1.65;
}

.overview-card .hotel-line {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 11px;
  color: white;
  font-weight: 700;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.route-planner label {
  display: grid;
  grid-template-columns: 42px 1fr;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
}

select {
  width: 100%;
  min-width: 0;
  padding: 9px 30px 9px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
  background: #fff;
  color: var(--ink);
  font-size: 13px;
}

select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(23, 107, 103, 0.10); }

.icon-button {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  color: var(--ink);
  font-size: 19px;
}

.route-result {
  margin-top: 12px;
  min-height: 56px;
  padding: 12px;
  border-radius: 12px;
  background: #f7f5f0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.route-result strong { color: var(--ink); }

.route-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 9px;
}

.route-head a {
  color: var(--teal);
  font-size: 12px;
  font-weight: 800;
  text-decoration: none;
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.metric {
  min-width: 0;
  padding: 8px 5px;
  border: 1px solid #e7e1d7;
  border-radius: 10px;
  background: white;
  text-align: center;
}

.metric b { display: block; color: var(--ink); font-size: 14px; }
.metric span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
.route-foot { margin: 8px 0 0; }

.places-card { flex: 1; min-height: 260px; }
.count-pill {
  padding: 4px 9px;
  border-radius: 999px;
  background: #f0ece4;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}

.filter-row {
  display: flex;
  gap: 6px;
  margin: -2px 0 12px;
  overflow-x: auto;
  scrollbar-width: none;
}

.filter-row::-webkit-scrollbar { display: none; }

.filter-chip {
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: white;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}

.filter-chip.active { border-color: var(--teal); background: #eaf5f3; color: var(--teal); font-weight: 800; }

.place-list { display: grid; gap: 6px; }

.place-row {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 8px;
  border: 1px solid transparent;
  border-radius: 11px;
  background: transparent;
  color: inherit;
  text-align: left;
}

.place-row:hover, .place-row:focus-visible { border-color: #e1dbd0; background: #f8f6f1; }

.place-row.warning { background: #fff4f2; }

.place-index {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border-radius: 9px;
  background: var(--marker-color, var(--blue));
  color: white;
  font-size: 11px;
  font-weight: 900;
}

.place-main { min-width: 0; }
.place-name {
  display: block;
  overflow: hidden;
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.place-meta {
  display: block;
  margin-top: 2px;
  overflow: hidden;
  color: var(--muted);
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.plan-badge {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  max-width: 100%;
  margin-top: 4px;
  padding: 2px 6px;
  border-radius: 999px;
  background: #edf5f4;
  color: var(--teal);
  font-size: 9px;
  font-weight: 800;
  line-height: 1.35;
}

.plan-badge.status-focus { background: #fff0dc; color: #9a4d17; }
.plan-badge.status-nearby { background: #edf5f4; color: var(--teal); }
.plan-badge.status-skip { background: #efefef; color: #777; }
.plan-badge.status-booking { background: #eee9ff; color: #6749a2; }
.plan-badge.status-timing { background: #fff0ee; color: #a33f32; }

.place-distance {
  color: var(--orange-dark);
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.map-stage {
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(23, 32, 53, 0.10);
  border-radius: 22px;
  background: #dfe7e4;
  box-shadow: var(--shadow);
}

#map { width: 100%; height: 100%; background: #e8ece8; }

.leaflet-container { font-family: inherit; }
.leaflet-control-zoom a { color: var(--ink); }

.number-marker {
  position: relative;
  display: grid;
  width: 31px;
  height: 31px;
  place-items: center;
  border: 2px solid white;
  border-radius: 11px 11px 11px 3px;
  background: var(--marker-color, var(--blue));
  color: white;
  box-shadow: 0 5px 13px rgba(23, 32, 53, 0.30);
  font-size: 11px;
  font-weight: 900;
  transform: rotate(-6deg);
}

.number-marker span { transform: rotate(6deg); }

.number-marker.hotel {
  width: 36px;
  height: 36px;
  border-radius: 50% 50% 50% 4px;
  background: var(--orange);
  font-size: 17px;
}

.number-marker.warning { background: var(--warning); }

.leaflet-tooltip.place-tooltip {
  padding: 5px 8px;
  border: 0;
  border-radius: 8px;
  background: rgba(23, 32, 53, 0.92);
  color: white;
  box-shadow: 0 5px 16px rgba(23, 32, 53, 0.18);
  font-size: 11px;
  font-weight: 700;
}

.leaflet-tooltip.place-tooltip::before { display: none; }

.popup h3 { margin: 0 0 4px; font-size: 15px; }
.popup p { margin: 3px 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
.popup .popup-tag { color: var(--orange-dark); font-weight: 800; }
.popup-plan { margin: 7px 0; }
.popup-plan p { margin-top: 5px; }
.popup .popup-actions { display: flex; gap: 7px; margin-top: 8px; }
.popup a {
  padding: 5px 8px;
  border-radius: 7px;
  background: #edf5f4;
  color: var(--teal);
  font-size: 11px;
  font-weight: 800;
  text-decoration: none;
}

.distance-label {
  padding: 3px 5px;
  border: 1px solid rgba(23, 32, 53, 0.10);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.90);
  color: #445066;
  box-shadow: 0 3px 10px rgba(23, 32, 53, 0.10);
  font-size: 9px;
  font-weight: 900;
  white-space: nowrap;
}

.map-toolbar {
  position: absolute;
  z-index: 700;
  top: 12px;
  right: 12px;
  display: flex;
  gap: 6px;
}

.map-toolbar button {
  padding: 8px 10px;
  border: 1px solid rgba(23, 32, 53, 0.12);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.94);
  color: var(--ink);
  box-shadow: 0 5px 14px rgba(23, 32, 53, 0.12);
  font-size: 11px;
  font-weight: 800;
}

.map-toolbar button.active { background: var(--ink); color: white; }

.map-legend {
  position: absolute;
  z-index: 700;
  right: 12px;
  bottom: 22px;
  max-width: 270px;
  padding: 10px 12px;
  border: 1px solid rgba(23, 32, 53, 0.10);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.93);
  box-shadow: 0 8px 24px rgba(23, 32, 53, 0.15);
  color: var(--muted);
  font-size: 10px;
  line-height: 1.55;
}

.legend-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 11px;
  margin-top: 5px;
}

.legend-item { display: inline-flex; align-items: center; gap: 4px; }
.legend-dot { width: 8px; height: 8px; border-radius: 3px; background: var(--legend-color); }

.map-status {
  position: absolute;
  z-index: 800;
  inset: 0;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #e4e9e5, #f4eee6);
  color: var(--muted);
  font-size: 13px;
  transition: opacity 220ms ease;
}

.map-status.hidden { pointer-events: none; opacity: 0; }

footer {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  padding: 12px 4px 0;
  color: #7b7f89;
  font-size: 10px;
  line-height: 1.5;
}

footer p { margin: 0; }

body.static-mode .hero { padding-bottom: 12px; }
body.static-mode .hero-copy { display: none; }
body.static-mode .city-tabs { margin-bottom: 8px; }
body.static-mode .workspace { height: 1120px; }
body.static-mode .route-planner { display: none; }
body.static-mode .places-card { min-height: 0; }
body.static-mode footer { display: none; }
body.static-mode:not(.static-overview) .overview-card { display: none; }
body.static-mode .place-list { gap: 3px; }
body.static-mode .place-row { padding: 4px 7px; }
body.static-mode .place-index { width: 25px; height: 25px; }
body.static-mode .place-meta { display: inline; margin-top: 1px; }
body.static-mode .plan-badge {
  margin: 1px 0 0 4px;
  padding: 1px 4px;
  font-size: 7px;
  vertical-align: top;
}
body.static-mode.static-overview .workspace { grid-template-columns: 300px minmax(0, 1fr); height: 900px; }
body.static-mode.static-overview .places-card { display: none; }

@media (max-width: 900px) {
  .app-shell { padding: 14px 14px 12px; }
  .hero { align-items: flex-start; flex-direction: column; gap: 12px; padding-bottom: 14px; }
  .itinerary-strip { max-width: 100%; overflow-x: auto; }
  .workspace { grid-template-columns: minmax(0, 1fr); width: 100%; height: auto; min-height: 0; }
  .map-stage { grid-row: 1; height: 52vh; min-height: 390px; }
  .panel { overflow: visible; }
  .overview-card { order: 0; }
  .route-planner { order: 1; }
  .places-card { order: 2; }
  footer { flex-direction: column; gap: 5px; }
}

@media (max-width: 520px) {
  .app-shell { padding: 10px; }
  h1 { font-size: 31px; }
  .hero-copy { font-size: 12px; }
  .itinerary-strip { width: 100%; justify-content: flex-start; }
  .city-tab { min-width: 76px; padding: 9px 12px; }
  .map-stage { height: 49vh; min-height: 360px; border-radius: 18px; }
  .map-legend { right: 8px; bottom: 18px; max-width: calc(100% - 76px); }
  .map-toolbar { top: 8px; right: 8px; }
  .metric-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">2026 · 5人 · 公共交通</p>
        <h1>长沙 · 武功山 · 南昌</h1>
        <p class="hero-copy">把酒店、景点、山路和两点距离放在同一张地图里。点击编号看详情，任选两点比较距离。</p>
      </div>
      <div class="itinerary-strip" aria-label="旅行日期">
        <span><b>7/29</b> 长沙</span><i>→</i><span><b>7/31</b> 武功山</span><i>→</i><span><b>8/1–5</b> 南昌</span>
      </div>
    </header>

    <nav class="city-tabs" aria-label="地图区域">
      <button class="city-tab active" data-city="总览">总览</button>
      <button class="city-tab" data-city="长沙">长沙 <span>19</span></button>
      <button class="city-tab" data-city="武功山">武功山 <span>19</span></button>
      <button class="city-tab" data-city="南昌">南昌 <span>22</span></button>
    </nav>

    <section class="workspace">
      <aside class="panel">
        <section id="overview-card" class="info-card overview-card"></section>

        <section id="route-planner" class="info-card route-planner">
          <div class="section-heading">
            <div>
              <p class="kicker">两点比较</p>
              <h2>查距离与时间</h2>
            </div>
            <button id="swap-route" class="icon-button" title="交换起点终点" aria-label="交换起点终点">⇄</button>
          </div>
          <label>
            <span>起点</span>
            <select id="origin-select"></select>
          </label>
          <label>
            <span>终点</span>
            <select id="destination-select"></select>
          </label>
          <div id="route-result" class="route-result" aria-live="polite"></div>
        </section>

        <section class="info-card places-card">
          <div class="section-heading">

  function key(a, b) { return [a, b].sort().join("::"); }

  function hours(minutes) {
    if (minutes < 60) return `${minutes}分钟`;

    const m = minutes % 60;
    return m ? `${h}小时${m}分` : `${h}小时`;
  }
  function navUrl(place) {

  }
  function colorFor(place) { return place.warning ? "#b42318" : (categoryMeta[place.category]?.[1] || cityColors[place.city]); }
  function visiblePlaces() {
    const citySet = activeCity === "总览"
      ? (staticCity === "总览" ? places.filter((place) => place.category === "hotel") : places)
      : places.filter((place) => place.city === activeCity);
    return activeCategory === "all" ? citySet : citySet.filter((place) => place.category === activeCategory);
  }
  function placeNumbers() {
    const cityList = activeCity === "总览" ? places : places.filter((place) => place.city === activeCity);
    return Object.fromEntries(cityList.map((place, index) => [place.id, index + 1]));
  }
  function markerIcon(place, index) {
    const hotel = place.category === "hotel";
    return L.divIcon({
      className: "",
      html: `<div class="number-marker ${hotel ? "hotel" : ""} ${place.warning ? "warning" : ""}" style="--marker-color:${colorFor(place)}"><span>${hotel ? "🛏" : index}</span></div>`,
      iconSize: hotel ? [38, 38] : [33, 33],
      iconAnchor: hotel ? [12, 32] : [10, 29],
      popupAnchor: [5, -28]
    });
  }
  function planBadge(place) {
    if (!place.planLabel) return "";
    const status = place.planStatus || "nearby";
    return `<span class="plan-badge status-${status}">${place.planLabel}</span>`;
  }
  function popupHtml(place) {
    const meta = categoryMeta[place.category]?.[0] || place.category;
    const warning = place.warning ? `<p class="popup-tag">⚠ 不属于本次当天往返常规线</p>` : "";
    const planning = place.planLabel
      ? `<div class="popup-plan">${planBadge(place)}${place.planNote ? `<p>${place.planNote}</p>` : ""}</div>`
      : "";
    return `<div class="popup">
      <h3>${place.name}</h3>
      <p>${place.district} · ${meta}</p>
      ${place.note ? `<p>${place.note}</p>` : ""}
      ${planning}
      ${warning}
      <div class="popup-actions">
        <a href="${navUrl(place)}" target="_blank" rel="noreferrer">高德搜索</a>
        <a href="#" data-set-destination="${place.id}">设为终点</a>
      </div>
    </div>`;
  }
  function renderMarkers() {
    markerLayer.clearLayers();
    markerRecords = [];
    const numbers = placeNumbers();
    const list = visiblePlaces();
    for (const place of list) {
      const marker = L.marker([place.lat, place.lon], { icon: markerIcon(place, numbers[place.id]) })

        .bindTooltip(place.name, {
          className: "place-tooltip",
          direction: staticCity && place.category === "hotel" ? "right" : "top",
          offset: staticCity && place.category === "hotel" ? [24, 0] : [5, -24],

          opacity: 0.95

        .addTo(markerLayer);
      marker.on("popupopen", (event) => {
        const link = event.popup.getElement()?.querySelector("[data-set-destination]");
        if (link) link.addEventListener("click", (clickEvent) => {
          clickEvent.preventDefault();
          if (activeCity === "总览") setCity(place.city);
          els.destination.value = place.id;
          updateRoute();
        });
      });
      markerRecords.push({ marker, place });
    }
    els.count.textContent = list.length;
  }

  function distanceBetween(a, b) {
    return routes.pairs[key(a, b)] || null;
  }
  function midpoint(a, b) { return [(a.lat + b.lat) / 2, (a.lon + b.lon) / 2]; }
  function addDistanceLabel(a, b, label, color = "#526071") {
    const icon = L.divIcon({ className: "", html: `<div class="distance-label" style="color:${color}">${label}</div>`, iconAnchor: [20, 9] });

  }
  function renderLinks() {
    linksLayer.clearLayers();

    if (!showLinks) return;

        const straight = haversine(from, to);

      }
      return;

    if (activeCity === "武功山") {
      for (const edge of routes.mountainEdges) {

        color: "#768195", weight: 1.6, opacity: 0.58, dashArray: "4 6"
      }).addTo(linksLayer);
      addDistanceLabel(from, to, route.roadKm ? `${route.roadKm.toFixed(1)}km路程` : `${route.straightKm.toFixed(1)}km`);
      linkLayers.push(line);
    }
  }

  function haversine(a, b) {
    const radians = (degree) => degree * Math.PI / 180;
    const dLat = radians(b.lat - a.lat);
    const dLon = radians(b.lon - a.lon);
    const lat1 = radians(a.lat);
    const lat2 = radians(b.lat);
    const value = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
    return 6371.0088 * 2 * Math.atan2(Math.sqrt(value), Math.sqrt(1 - value));
  }

  function fitCurrent() {
    const list = visiblePlaces();
    if (!list.length) return;
    const bounds = L.latLngBounds(list.map((place) => [place.lat, place.lon]));
    map.fitBounds(bounds, { padding: [52, 52], maxZoom: activeCity === "武功山" ? 14 : 15, animate: false });
  }
  function renderOverview() {
    const copy = cityCopy[activeCity];
    els.overview.innerHTML = `<p class="kicker">${activeCity === "总览" ? "Trip map" : `${places.filter((p) => p.city === activeCity).length} 个地点`}</p>
      <h2>${copy.title}</h2><p>${copy.text}</p><p class="hotel-line"><span>●</span><span>${copy.hotel}</span></p>`;
    els.listTitle.textContent = activeCity === "总览" ? "三地清单" : `${activeCity}全部地点`;
  }
  function renderFilters() {
    const list = activeCity === "总览" ? places : places.filter((place) => place.city === activeCity);
    const categories = [...new Set(list.map((place) => place.category))];
    els.filters.innerHTML = [
      `<button class="filter-chip ${activeCategory === "all" ? "active" : ""}" data-category="all">全部</button>`,
      ...categories.map((category) => `<button class="filter-chip ${activeCategory === category ? "active" : ""}" data-category="${category}">${categoryMeta[category]?.[0] || category}</button>`)
    ].join("");
    for (const button of els.filters.querySelectorAll("button")) {
      button.addEventListener("click", () => {
        activeCategory = button.dataset.category;
        renderFilters();
        renderMarkers();
        renderPlaceList();
        fitCurrent();
      });
    }
  }
  function hotelForCity(city) { return places.find((place) => place.city === city && place.category === "hotel"); }
  function renderPlaceList() {
    const numbers = placeNumbers();
    const list = visiblePlaces();
    const activeHotel = activeCity === "总览" ? null : hotelForCity(activeCity);
    els.list.innerHTML = list.map((place) => {
      const route = activeHotel && place.id !== activeHotel.id ? distanceBetween(activeHotel.id, place.id) : null;
      const distance = route ? (activeCity === "武功山" ? `直线${route.straightKm}km` : `路程${route.roadKm}km`) : place.city;
      return `<button class="place-row ${place.warning ? "warning" : ""}" data-place="${place.id}" style="--marker-color:${colorFor(place)}">
        <span class="place-index">${place.category === "hotel" ? "🛏" : numbers[place.id]}</span>
        <span class="place-main"><span class="place-name">${place.name}</span><span class="place-meta">${place.district} · ${categoryMeta[place.category]?.[0] || place.category}</span>${planBadge(place)}</span>
        <span class="place-distance">${distance}</span>
      </button>`;
    }).join("");
    for (const button of els.list.querySelectorAll("[data-place]")) {
      button.addEventListener("click", () => {
        const record = markerRecords.find((item) => item.place.id === button.dataset.place);
        if (record) {
          map.flyTo([record.place.lat, record.place.lon], Math.max(map.getZoom(), activeCity === "武功山" ? 15 : 16), { duration: 0.55 });
          record.marker.openPopup();
        }
      });
    }
  }
  function renderLegend() {
    if (activeCity === "武功山") {
      els.legend.innerHTML = `<strong>武功山线路图例</strong><div class="legend-row">
        <span class="legend-item"><i class="legend-dot" style="--legend-color:#f3703a"></i>徒步上山</span>
        <span class="legend-item"><i class="legend-dot" style="--legend-color:#176b67"></i>索道</span>
        <span class="legend-item"><i class="legend-dot" style="--legend-color:#4c6f8f"></i>旅游大巴</span>
        <span class="legend-item"><i class="legend-dot" style="--legend-color:#b42318"></i>非当天穿越线</span>
      </div><div style="margin-top:6px">已购 8/1 19:16 萍乡北→南昌西，按“全程徒步上山+索道下山”风险较高。优先改签 20:30 后；若保留，须赶景区首班转运、预订 16:30–16:40 的 7 座车，最晚约 16:20 回到游客中心。</div>`;
      return;
    }
    const list = activeCity === "总览" ? ["长沙", "武功山", "南昌"] : [...new Set(visiblePlaces().map((place) => place.category))];
    els.legend.innerHTML = `<strong>${activeCity === "总览" ? "城市" : "地点分类"}</strong><div class="legend-row">${
      list.map((item) => {
        const label = activeCity === "总览" ? item : (categoryMeta[item]?.[0] || item);
        const color = activeCity === "总览" ? cityColors[item] : categoryMeta[item]?.[1];
        return `<span class="legend-item"><i class="legend-dot" style="--legend-color:${color}"></i>${label}</span>`;
      }).join("")
    }</div>${activeCity !== "总览" ? "<div style=\"margin-top:6px\">灰色虚线为相邻点道路距离；任选两点可看完整比较。</div>" : ""}`;
  }
  function updateSelects() {
    const disabled = activeCity === "总览";
    els.planner.style.opacity = disabled ? "0.55" : "1";
    for (const select of [els.origin, els.destination]) select.disabled = disabled;
    if (disabled) {
      els.origin.innerHTML = "<option>请先选择城市</option>";
      els.destination.innerHTML = "<option>请先选择城市</option>";
      els.result.innerHTML = "切换到长沙、武功山或南昌后，可任选两个地点比较。";
      routeSelectionLayer.clearLayers();
      return;
    }
    const list = places.filter((place) => place.city === activeCity);
    const options = list.map((place) => `<option value="${place.id}">${place.category === "hotel" ? "🛏 " : ""}${place.name}</option>`).join("");
    els.origin.innerHTML = options;
    els.destination.innerHTML = options;
    const hotel = hotelForCity(activeCity);
    els.origin.value = hotel.id;
    els.destination.value = list.find((place) => place.category !== "hotel").id;
    if (staticCity) {
      routeSelectionLayer.clearLayers();
      return;
    }
    updateRoute();
  }

  function mountainPath(startId, endId) {
    const graph = {};
    for (const edge of routes.mountainEdges) {
      (graph[edge.from] ||= []).push({ id: edge.to, edge });
      (graph[edge.to] ||= []).push({ id: edge.from, edge });
    }
    const dist = { [startId]: 0 };
    const previous = {};
    const queue = new Set(Object.keys(graph));
    while (queue.size) {
      let current = null;
      for (const id of queue) if (current === null || (dist[id] ?? Infinity) < (dist[current] ?? Infinity)) current = id;
      if (current === null || !Number.isFinite(dist[current])) break;
      queue.delete(current);
      if (current === endId) break;
      for (const neighbor of graph[current] || []) {
        const next = dist[current] + neighbor.edge.minutes;
        if (next < (dist[neighbor.id] ?? Infinity)) {
          dist[neighbor.id] = next;
          previous[neighbor.id] = { id: current, edge: neighbor.edge };
        }
      }
    }
    if (!Number.isFinite(dist[endId])) return null;
    const ids = [endId];
    const edges = [];
    let cursor = endId;
    while (cursor !== startId) {
      const step = previous[cursor];
      if (!step) return null;
      edges.unshift(step.edge);
      cursor = step.id;
      ids.unshift(cursor);
    }
    return {
      ids,
      edges,
      minutes: Math.round(edges.reduce((sum, edge) => sum + edge.minutes, 0)),
      km: Math.round(edges.reduce((sum, edge) => sum + edge.km, 0) * 10) / 10,
      modes: [...new Set(edges.map((edge) => edge.mode))]
    };
  }
  function updateRoute() {
    routeSelectionLayer.clearLayers();
    if (activeCity === "总览") return;
    const origin = byId[els.origin.value];
    const destination = byId[els.destination.value];
    if (!origin || !destination || origin.id === destination.id) {
      els.result.innerHTML = "起点和终点不能相同。";
      return;
    }
    const route = distanceBetween(origin.id, destination.id);
    const nav = navUrl(destination);
    if (activeCity === "武功山") {
      const path = mountainPath(origin.id, destination.id);
      const ids = path?.ids || [origin.id, destination.id];
      routeLayer = L.polyline(ids.map((id) => [byId[id].lat, byId[id].lon]), {
        color: "#111827", weight: 5, opacity: 0.86
      }).addTo(routeSelectionLayer);
      map.fitBounds(routeLayer.getBounds(), { padding: [70, 70], maxZoom: 16, animate: false });
      els.result.innerHTML = `<div class="route-head"><strong>${origin.name} → ${destination.name}</strong><a href="${nav}" target="_blank" rel="noreferrer">导航搜索 ↗</a></div>
        <div class="metric-grid">
          <div class="metric"><b>${route.straightKm}km</b><span>直线距离</span></div>
          <div class="metric"><b>${path ? `${path.km}km` : "未连通"}</b><span>分段山路</span></div>
          <div class="metric"><b>${path ? hours(path.minutes) : "现场确认"}</b><span>山路用时</span></div>
        </div><p class="route-foot">${path ? `经过：${ids.map((id) => byId[id].name).join(" → ")}` : "这两个点不在同一条已整理的景区路线中。"} 山区用时不含排队、拍照和恶劣天气。</p>`;
      return;
    }
    routeLayer = L.polyline([[origin.lat, origin.lon], [destination.lat, destination.lon]], {
      color: "#111827", weight: 4, opacity: 0.82, dashArray: "7 7"
    }).addTo(routeSelectionLayer);
    map.fitBounds(routeLayer.getBounds(), { padding: [70, 70], maxZoom: 16, animate: false });
    els.result.innerHTML = `<div class="route-head"><strong>${origin.name} → ${destination.name}</strong><a href="${nav}" target="_blank" rel="noreferrer">导航搜索 ↗</a></div>
      <div class="metric-grid">
        <div class="metric"><b>${route.straightKm}km</b><span>直线</span></div>
        <div class="metric"><b>${route.roadKm}km</b><span>道路</span></div>
        <div class="metric"><b>${route.driveMinutes}分</b><span>打车典型</span></div>
        <div class="metric"><b>${route.walkKm}km</b><span>步行估算</span></div>
        <div class="metric"><b>${hours(route.walkMinutes)}</b><span>步行时间</span></div>
        <div class="metric"><b>${route.transitMinutes}分</b><span>${route.transitMode}</span></div>
      </div><p class="route-foot">${route.source}；不是实时导航结果，出发前请复核。</p>`;
  }

  function setCity(city) {
    activeCity = city;
    activeCategory = "all";
    for (const tab of els.tabs) tab.classList.toggle("active", tab.dataset.city === city);
    renderOverview();
    renderFilters();
    renderMarkers();
    renderLinks();
    renderPlaceList();
    renderLegend();
    updateSelects();
    setTimeout(fitCurrent, 30);
  }

  els.tabs.forEach((tab) => tab.addEventListener("click", () => setCity(tab.dataset.city)));
  els.origin.addEventListener("change", updateRoute);
  els.destination.addEventListener("change", updateRoute);
  els.swap.addEventListener("click", () => {
    const origin = els.origin.value;
    els.origin.value = els.destination.value;
    els.destination.value = origin;
    updateRoute();
  });
  els.fit.addEventListener("click", fitCurrent);
  els.toggleLinks.addEventListener("click", () => {
    showLinks = !showLinks;
    els.toggleLinks.classList.toggle("active", showLinks);
    renderLinks();
  });
  window.addEventListener("resize", () => map.invalidateSize());

  map.whenReady(() => {
    els.status.classList.add("hidden");
    document.body.dataset.mapReady = "true";
  });
  window.TRAVEL_MAP_DEBUG = { map, fitCurrent };
  setCity(activeCity);
  setTimeout(() => {
    map.invalidateSize();
    fitCurrent();
  }, 160);
})();
</script>
</body>
</html>
